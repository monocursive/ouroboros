[package]
name = "ouro-fixture"
description = "Conformance child binary and test harness for ouro-jail (jail-v1 §15). Never packaged."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "ouro_fixture"
path = "src/lib.rs"

[[bin]]
name = "ouro-fixture"
path = "src/main.rs"

# Test-only stand-in for `ouro-jail`: it writes a prepared control message,
# waits for the §8.2 gate frame and execs the target argv. It exists so the
# harness pipe plumbing and `GateOwner` are proved before the real jail lands.
[[bin]]
name = "stand-in-jail"
path = "src/bin/stand-in-jail.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
