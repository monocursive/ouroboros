[package]
name = "ouro-ledger"
description = "Durable admission and evidence for independently supervised jail attempts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
jsonschema = { version = "0.57.0", default-features = false }
ouro-records = { path = "../ouro-records" }
clap = { version = "4.6.6", features = ["derive"] }
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled", "limits"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"
sha2 = "0.10.9"
ring = "0.17.14"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
ouro-fixture = { path = "../ouro-fixture" }
