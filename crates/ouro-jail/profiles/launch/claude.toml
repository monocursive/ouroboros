# EXPERIMENTAL launch profile (jail-v1 §12, north star §4.5).
#
# Embedded starter data, selected with `--launch claude`. An operator file
# at `<config-dir>/launch/claude.toml` (mode 0600) overrides it. Review
# its grants against the installation. Compatibility remains experimental
# except for the exact builds recorded in agent-compatibility.md.
#
# Sources are the north star's initial inputs: file credentials and settings
# from the node's Claude config directory (`~/.claude`). There is no Keychain
# extraction; a macOS Keychain credential is a separate, unscheduled problem.

name = "claude"
jail = "agent"
state_var = "CLAUDE_CONFIG_DIR"

# [credentials.credentials]
# source = "~/.claude/.credentials.json"
# dest = ".credentials.json"
# mode = "copy_rw"

# [credentials.settings]
# source = "~/.claude/settings.json"
# dest = "settings.json"
# mode = "bind_ro"

[network]
allow = ["api.anthropic.com:443"]
