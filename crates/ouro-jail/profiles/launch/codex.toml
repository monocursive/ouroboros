# EXPERIMENTAL launch profile (jail-v1 §12, north star §4.5).
#
# Embedded starter data, selected with `--launch codex`. An operator file
# at `<config-dir>/launch/codex.toml` (mode 0600) overrides it. Review
# its grants against the installation. Compatibility remains experimental
# except for the exact builds recorded in agent-compatibility.md.
#
# Sources are the north star's initial paths: the node's `~/.codex`. `copy_rw`
# can rotate a refresh token the node's own file then lacks; `bind_ro` is the
# alternative, and refresh then fails inside the attempt.

name = "codex"
jail = "agent"
state_var = "CODEX_HOME"
home_is_state = true

# [credentials.auth]
# source = "~/.codex/auth.json"
# dest = "auth.json"
# mode = "copy_rw"

# [credentials.config]
# source = "~/.codex/config.toml"
# dest = "config.toml"
# mode = "bind_ro"

[network]
allow = ["api.openai.com:443", "*.openai.com:443"]
