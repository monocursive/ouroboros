[package]
name = "xtask"
description = "Repository tasks for ouro-jail: the I02 vendor-name scan and the conformance driver."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# J5-D: the freeze file hashes Cargo.lock and the evidence tables, and pins
# the jail's own renderings of its baselines and backend plans.
sha2 = "0.10.9"
ouro-jail = { path = "../ouro-jail" }
toml = "0.8"

[dev-dependencies]
# J5-D: the freeze tests build throwaway trees and repositories.
tempfile = "3.27.0"
