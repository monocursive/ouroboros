[package]
name = "xtask"
description = "Repository tasks: the I02 scan, the conformance driver and gate verdict, the freeze file and the performance harness."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The freeze file hashes Cargo.lock and the evidence tables, and pins the
# jail's own renderings of its baselines and backend plans.
sha2 = "0.10.9"
ouro-jail = { path = "../ouro-jail" }
# `perf` reads the fixture's perf-launch result through the type that writes
# it. No cycle: the fixture depends on neither the jail nor this crate.
ouro-fixture = { path = "../ouro-fixture" }
toml = "0.8"

[dev-dependencies]
# Tests build throwaway trees and repositories.
tempfile = "3.27.0"
