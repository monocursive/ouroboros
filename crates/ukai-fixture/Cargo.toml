[package]
name = "ukai-fixture"
description = "Conformance child binary and test harness for ukai-jail (jail-v1 §15). Never packaged."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "ukai_fixture"
path = "src/lib.rs"

[[bin]]
name = "ukai-fixture"
path = "src/main.rs"

# Test-only stand-in for `ukai-jail`: it announces `prepared`, waits for the
# §8.2 gate frame and execs the target argv. It proves the harness's pipe
# plumbing and `GateOwner` without the real jail, and carries the §8.2
# frame-rejection cases.
[[bin]]
name = "stand-in-jail"
path = "src/bin/stand-in-jail.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The product's record contracts: canonical bytes and receipt digests, the
# §13.3 trace rule, the gate frame and the record types. No cycle: the
# records crate depends on nothing in this workspace.
ukai-records.workspace = true

[dev-dependencies]
tempfile.workspace = true
