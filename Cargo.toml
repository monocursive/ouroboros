# Workspace per jail-v1 §4. One crate per process the north star names, plus the
# test-only fixture crate and the task runner. `crates/ouro-jail-ebpf` is not a
# member: J0 has not selected eBPF, and a BPF target never builds on macOS.
[workspace]
resolver = "3"
members = ["crates/ouro-jail", "crates/ouro-fixture", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = 3
debug = false
