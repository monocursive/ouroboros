# Workspace per jail-v1 §4: one crate per process the north star names, the
# shared records crate, the test-only fixture crate and the task runner. There
# is no BPF object crate: v1 withdrew eBPF (§5.2), and the ptrace observer is
# compiled into `ouro-jail`.
[workspace]
resolver = "3"
members = ["crates/ouro", "crates/ouro-jail", "crates/ouro-records", "crates/ouro-ledger", "crates/ouro-fixture", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

# Every dependency two or more crates share, so they ask for one version.
# Features stay with the crate that needs them; a dependency only one crate
# uses stays in that crate's manifest.
[workspace.dependencies]
base64 = "0.22.1"
clap = "4.6.6"
jsonschema = { version = "0.57.0", default-features = false }
libc = "0.2.189"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
toml = "0.8.23"
uuid = "1.24.0"
ouro-fixture = { path = "crates/ouro-fixture" }
ouro-records = { path = "crates/ouro-records" }

[workspace.lints.clippy]
# The group yields to the single lints below it.
all = { level = "deny", priority = -1 }
# Every `unsafe` block states why it is sound. `warn` until the ledger and
# fixture blocks still without a SAFETY comment have one; then `deny`.
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
debug = false
