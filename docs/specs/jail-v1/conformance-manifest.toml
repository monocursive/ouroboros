# Expected capabilities on the reference host (jail-v1 §16).
#
# `cargo xtask conformance` compares every row here with `ouro-jail doctor
# --json` on the provisioned Linux host. This file is the pinned expectation,
# so ANY deviation fails the job and has to be changed deliberately: a host
# that silently gained a capability is as much a change as one that lost it.
# `skipped` never satisfies a row (§3.1: "a skipped check cannot satisfy a
# requirement"), and a capability the manifest names but doctor does not report
# fails too.
#
# Statuses are the §3.1 vocabulary: available, unavailable, unsupported, error,
# skipped. `available` means the probe succeeded on this host with this
# identity; `unavailable` means the implementation exists but the host
# prerequisites are missing; `unsupported` means the implementation lacks it.
#
# Host: Ubuntu 26.04.1 LTS, kernel 7.0.0-31-generic, x86_64 KVM, bubblewrap
# 0.11.1, account `ouro-ci` (uid 1001, no sudo, CapEff 0), measured 2026-09-22.
# Every row cites the J0 evidence that justifies it. Re-measure and re-pin when
# the kernel, the distribution, bubblewrap or the account changes (§16).

[expected]

# bubblewrap 0.11.1 is installed and starts. Evidence:
# evidence/bwrap-probe-2026-09-22-ouro-ci.txt, header line `bwrap: bubblewrap
# 0.11.1` and check 1 (`--unshare-all`, exit 0); also
# evidence/reference-host-2026-09-22-ouro-ci.txt `bwrap:`.
bwrap_present = "available"

# An unprivileged user namespace can be created. Evidence:
# evidence/bwrap-probe-2026-09-22-ouro-ci.txt check 1 (exit 0) and check 2,
# which shows the sandboxed process under `bwrap//&unpriv_bwrap (enforce)`;
# evidence/reference-host-2026-09-22-ouro-ci.txt `userns_unshare_test: ok`.
user_namespace = "available"

# A PID namespace is applied: the shell inside sees pid 2. Evidence:
# evidence/bwrap-probe-2026-09-22-ouro-ci.txt check 6 (`pid=2`, exit 0).
pid_namespace = "available"

# A network namespace is applied and blocks egress: connect fails with
# ENETUNREACH under `--unshare-net`. Evidence:
# evidence/bwrap-probe-2026-09-22-ouro-ci.txt check 5 (exit 1) and
# backend-evaluation.md §1.1 row "`--unshare-net` blocks a connect".
network_namespace = "available"

# A read-only bind holds: a write under a `--ro-bind` /usr fails and leaves
# nothing behind. Evidence: evidence/bwrap-probe-2026-09-22-ouro-ci.txt
# check 3 (exit 0) and backend-evaluation.md §1.1 row "`--ro-bind` holds".
mount_readonly_bind = "available"

# A seccomp filter passed through `--seccomp` loads under the distribution's
# AppArmor profile: `Seccomp: 2`, `NoNewPrivs: 1`. Evidence:
# evidence/bwrap-nesting-probe-2026-09-22-ouro-ci.txt measurement 4 (exit 0);
# without a filter the sandbox shows `Seccomp: 0`
# (evidence/bwrap-probe-2026-09-22-ouro-ci.txt check 7).
seccomp_filter_load = "available"

# PTRACE_SEIZE of an owned descendant works with no provisioning under
# `kernel.yama.ptrace_scope=1`, including through bubblewrap's user and PID
# namespaces. Evidence: evidence/ptrace-probe-2026-09-22-ouro-ci.txt §2 and
# evidence/tracer-spike-2026-09-22-ouro-ci.txt §1 (15,109 closed-set events,
# 30,220 stops, zero gaps); backend-evaluation.md §2.1.
ptrace_seize_descendant = "available"
observer_closed_set = "available"

# J2 runs doctor/tests inside `systemd-run --user --scope`, with
# XDG_RUNTIME_DIR=/run/user/$(id -u). Remeasured as ouro-ci 2026-09-22:
# the delegated user@1001.service has cpu/memory/pids enabled. Each doctor
# probe creates a unique leaf, sets/reads its control, places a fixture,
# invokes cgroup.kill, verifies populated=0, reaps and removes the leaf.
# An ordinary SSH session is still outside that subtree and cannot move in.
# Full measurement and tests: evidence/j2-doctor-2026-09-22-ouro-ci.json and
# evidence/j2-test-log-2026-09-22-ouro-ci.txt, run 20260922T165552Z-e89a3f7918c2,
# which includes the J2 review fixes recorded in j2-authority.md.
cgroup_delegated_leaf = "available"
cgroup_pids = "available"
cgroup_memory = "available"
cgroup_cpu = "available"

# Informational, and deliberately phrased so `available` means THE RESTRICTION
# IS ON: `kernel.apparmor_restrict_unprivileged_userns` is 1, which permits
# `unshare(CLONE_NEWUSER)` but strips capabilities from the resulting
# namespace. Evidence: evidence/reference-host-2026-09-22-ouro-ci.txt
# `sysctl.kernel.apparmor_restrict_unprivileged_userns: 1`;
# backend-evaluation.md §1 row for that sysctl.
apparmor_userns_restriction = "available"

# Nesting is denied by Ubuntu's own profile, not by our plan: every child of
# bwrap is stacked under `unpriv_bwrap`, which carries `audit deny capability`,
# so `unshare -Urm`, a nested read-only bind mount and bubblewrap-inside-
# bubblewrap all fail with EPERM. Evidence:
# evidence/bwrap-nesting-probe-2026-09-22-ouro-ci.txt measurements 1, 2, 3 and
# 5 (all exit 1) with the profile text quoted verbatim; backend-evaluation.md
# §1.1 rows for nested namespaces and nested bubblewrap. The jail requires no
# host configuration (jail-v1 revision 9), so this host stays stock and this
# row stays unavailable: `agent` runs without nested user namespaces, and S03
# proves its Landlock and seccomp nesting instead.
nested_user_namespace = "unavailable"

# J3 wave 2 (`agent`), measured live as ouro-ci on 2026-09-22 with this slice's
# build: `ouro-jail doctor --json` and `doctor --profile agent --json` (ready)
# inside the delegated scope. Evidence: the J3 agent report's
# j3-agent-doctor-2026-09-22-ouro-ci.json (proposed for evidence/; each row's
# `evidence_ref` carries the measured facts) and the live suite
# crates/ouro-jail/tests/conformance_j3_agent.rs (21 tests: S03, N01-N05, C01,
# X06 for agent). No host configuration was changed.

# An unprivileged child installs the agent's mediation filter with
# SECCOMP_FILTER_FLAG_NEW_LISTENER and this process takes the listener with
# pidfd_getfd (Yama scope 1 permits a descendant). Same mechanism as
# evidence/unixpeer-spike-2026-09-22-ouro-ci.txt steps 1-2.
seccomp_user_notification = "available"

# One real `ouro-jail run --profile agent`: through 127.0.0.1:3128 an allowed
# loopback origin (numeric grant) answers 200 and the proxy records
# allow/relayed; an ungranted port answers 403 (deny/host_not_allowed) and its
# listener sees no connection; direct TCP egress is ENETUNREACH.
agent_proxy_bridge = "available"

# In the same run: a host-bound pathname socket in the workspace is refused
# EACCES by the mediator and never sees a connection; a socket the child binds
# in scratch is reached.
agent_unix_peer_mediation = "available"

# In the same run: a Landlock (ABI 8) + seccomp inner sandbox starts inside
# `agent` and denies a write and a read outside its grant (EACCES) and mkdir
# (EPERM); remount, umount, setns and unshare fail EPERM; direct egress fails
# ENETUNREACH. The namespace form stays unavailable (nested_user_namespace
# above), which `agent` records and does not refuse for.
agent_inner_sandbox = "available"
