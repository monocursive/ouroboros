# Milestone-1 freeze (jail-v1 §16). Generated by `cargo xtask freeze`;
# do not edit by hand. crates/ouro-jail/tests/portable_freeze.rs fails
# when an in-tree value drifts from this file: a change to any of them
# needs the conformance rerun §16 requires, then a new `cargo xtask
# freeze --doctor <that run's doctor.json>`.
schema = "ouro.jail.milestone-freeze/1"
milestone = 1

# rust-toolchain.toml and Cargo.toml [workspace.package]
[toolchain]
channel = "1.98.1"
rust_version = "1.98.1"

# Cargo.lock, byte for byte
[cargo_lock]
sha256 = "83ae607b2762d6d844ea5b370f77bf8e93134a375c10a07acee4fede08696c8e"
packages = 125

# The seccomp programs' digests, from docs/specs/jail-v1/evidence/seccomp-table-*.txt
[filters]
arch = "x86_64"
tool = "sha256:3619e295e5f9428b69cd52d0ec993986782334c5127d18ea5f9e0f5ba4bced85"
agent = "sha256:8f12a643ee5408e71a8e03f4b2e4d64934030d302dfbbad9a8b7a3626b1f6051"
agent_namespace = "sha256:3a866f3488d5d07e89b42e0d9b0256be5f363871bdf805e7d8d9010de6597acd"
agent_mediation = "sha256:28c98e72b91a22c212d5dfdddfcc1f1ca153c5a8e89c15833c26724b263ebeff"

# The evidence tables themselves, byte for byte
[filters.table_sha256]
"seccomp-table-tool-x86_64.txt" = "6246db047097ba21be8f4e5e47edaeff3bc1b42adb1d81743841547d8bfb5b86"
"seccomp-table-agent-x86_64.txt" = "330a17bfd058fab4dd8c75834847d3a6912e29cf20f359e808c313dfd23f873e"
"seccomp-table-agent-namespace-x86_64.txt" = "10efbed7f8632739d405954eb702d1a3e8800a563572c717d6d930d1da851621"

# The observer's closed set, from docs/specs/jail-v1/evidence/closed-set-x86_64.txt
[closed_set]
name = "linux-closed-v1"
narrowing_filter = "sha256:9e63101563d550ff9aca317797385047c6af0e62ecfd1352cdbbb191135b0a66"
table_sha256 = "53fad28f1e3b4bf206eecf39317d2248c537b77db55cc5c50d88bf33baca2349"

# The contained mount baselines: what every contained profile mounts
[mounts]
# crates/ouro-jail/src/profiles.rs LINUX_RUNTIME_ROOTS
linux_runtime_roots = ["/usr", "/bin", "/lib", "/lib64", "/etc/ssl", "/etc/resolv.conf", "/etc/passwd", "/etc/group", "/etc/hosts", "/etc/localtime"]
# crates/ouro-jail/src/profiles.rs PROTECTED_SEGMENTS
protected_segments = [".git", ".ouroboros"]
# crates/ouro-jail/src/platform/linux/bwrap.rs RUNTIME_ROOTS
backend_runtime_roots = ["/usr", "/bin", "/sbin", "/lib", "/lib32", "/lib64", "/libx32"]
# crates/ouro-jail/src/platform/linux/bwrap.rs ETC_PATHS
backend_etc_paths = ["/etc/ssl", "/etc/resolv.conf", "/etc/passwd", "/etc/group", "/etc/hosts", "/etc/localtime", "/etc/ld.so.cache"]

# The bundled launch profiles (crates/ouro-jail/profiles/launch): what each one mounts or
# copies into the sandbox, and the hosts it allows.

[[launch_profile]]
file = "crates/ouro-jail/profiles/launch/claude.toml"
name = "claude"
jail = "agent"
state_var = "CLAUDE_CONFIG_DIR"
home_is_state = false
state_subdirs = []
network_allow = ["api.anthropic.com:443"]
environment = "{}"
[[launch_profile.credential]]
id = "credentials"
source = "~/.claude/.credentials.json"
dest = ".credentials.json"
mode = "copy_rw"
[[launch_profile.credential]]
id = "settings"
source = "~/.claude/settings.json"
dest = "settings.json"
mode = "bind_ro"

[[launch_profile]]
file = "crates/ouro-jail/profiles/launch/codex.toml"
name = "codex"
jail = "agent"
state_var = "CODEX_HOME"
home_is_state = true
state_subdirs = []
network_allow = ["api.openai.com:443", "*.openai.com:443"]
environment = "{}"
[[launch_profile.credential]]
id = "auth"
source = "~/.codex/auth.json"
dest = "auth.json"
mode = "copy_rw"
[[launch_profile.credential]]
id = "config"
source = "~/.codex/config.toml"
dest = "config.toml"
mode = "bind_ro"

[[launch_profile]]
file = "crates/ouro-jail/profiles/launch/opencode.toml"
name = "opencode"
jail = "agent"
home_is_state = true
state_subdirs = ["config/opencode", "data/opencode", "cache/opencode", "state/opencode"]
network_allow = ["opencode.ai", "models.opencode.ai", "registry.npmjs.org"]
environment = "{\"XDG_CACHE_HOME\":{\"state\":\"cache\"},\"XDG_CONFIG_HOME\":{\"state\":\"config\"},\"XDG_DATA_HOME\":{\"state\":\"data\"},\"XDG_STATE_HOME\":{\"state\":\"state\"}}"

# What every contained profile passes from the operator's environment, and its PATH
[contained]
environment_names = ["LANG", "TERM", "TZ"]
path = "/usr/local/bin:/usr/bin:/bin"

