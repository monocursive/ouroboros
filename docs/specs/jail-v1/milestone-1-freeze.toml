tool = "sha256:d07af2773b3341c4b29dd366c201d492294b4f084744cd1cc023683341dfe237"
agent = "sha256:6f7b5d4cfbc45831d7737d5ab5ee659523f1c96197e4cd8e10bcab5e76ca3ab9"
agent_namespace = "sha256:da4883afce274b6104b0abf3bce3c67c21a8b7a62d83ea91d4b6be1df5005877"
