# The contained mount baselines: what every contained profile mounts
[mounts]
# crates/ouro-jail/src/profiles.rs LINUX_RUNTIME_ROOTS
linux_runtime_roots = ["/usr", "/bin", "/lib", "/lib64", "/etc/ssl", "/etc/resolv.conf", "/etc/passwd", "/etc/group", "/etc/hosts", "/etc/localtime"]
# crates/ouro-jail/src/profiles.rs PROTECTED_SEGMENTS
protected_segments = [".git", ".ouroboros"]
# crates/ouro-jail/src/platform/linux/bwrap.rs RUNTIME_ROOTS
backend_runtime_roots = ["/usr", "/bin", "/sbin", "/lib", "/lib32", "/lib64", "/libx32"]
# crates/ouro-jail/src/platform/linux/bwrap.rs ETC_PATHS
backend_etc_paths = ["/etc/ssl", "/etc/resolv.conf", "/etc/passwd", "/etc/group", "/etc/hosts", "/etc/localtime", "/etc/ld.so.cache"]

