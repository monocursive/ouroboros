# Milestone-1 freeze (jail-v1 §16). Generated by `cargo xtask freeze`;
# do not edit by hand. crates/ouro-jail/tests/portable_freeze.rs fails
# when an in-tree value drifts from this file: a change to any of them
# needs the conformance rerun §16 requires, then a new `cargo xtask
# freeze --doctor <that run's doctor.json>`.
schema = "ouro.jail.milestone-freeze/1"
milestone = 1

# rust-toolchain.toml and Cargo.toml [workspace.package]
[toolchain]
channel = "1.98.1"
rust_version = "1.98.1"

# Cargo.lock, byte for byte
[cargo_lock]
sha256 = "3520144f795eb8d7d9cef464ff07332af2444152e671049244c9553deed17bce"
packages = 125

# The seccomp programs' digests, from docs/specs/jail-v1/evidence/seccomp-table-*.txt
[filters]
