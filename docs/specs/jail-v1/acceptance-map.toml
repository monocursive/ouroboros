note = "Under strict evidence a 500 ms wall (shorter than the 1 s no-progress deadline) with a Never consumer and >4 MiB of events fires on time by wall_expiry (the target is signalled), NOT by an evidence loss — the wall is enforced while the trace is saturated but before the loss is declared (a declared loss under strict would have stopped it first). Saturation is by event volume, not a sleep. Mutation-provable via the nonblocking trace fd (set_nonblocking removed -> the loop hangs on the full pipe, RED on host)."

