# ------------------------------------------------------------------ I03

[[gate]]
id = "I03"
row = "A scripted trusted owner compares the prepared policy/argv/requirements with its expected plan. Mismatch closes the gate with no target marker; a matching plan releases once. Untrusted request fields cannot mutate the owner's operator inputs. This proves the composition seam, not company identity or authorization."

[[clause]]
id = "I03.1"
gate = "I03"
clause = "An owner that releases the attempt it was told about starts exactly one target"
tag = "live-cli"
tests = [
  "ouro-jail/tests/conformance_j1.rs::i03_gate",
]
note = "The owner's expected plan is built from the jail's own proposal (binds only attempt_id); comparing against an independent plan is I03.2."

[[clause]]
id = "I03.2"
gate = "I03"
clause = "The owner compares the prepared policy digest, argv digest and requirements with its expected plan"
tag = "live-cli"
tests = [
  "ouro-jail/tests/j5_process_linux.rs::i03_an_independent_full_plan_releases_once_and_a_mismatch_closes_the_gate",
]
note = "The plan comes from the owner's own inputs (explain --json for digest and requirements, canonical argv framing, an attempt id it allocates), never from the receipt it judges. Red when the product writes a wrong argv_digest or drops a requirement."

[[clause]]
id = "I03.3"
gate = "I03"
clause = "A mismatch closes the gate with no target marker, against the real jail"
tag = "live-cli"
tests = [
  "ouro-jail/tests/j5_process_linux.rs::i03_an_independent_full_plan_releases_once_and_a_mismatch_closes_the_gate",
  "ouro-jail/tests/j5_process_linux.rs::i03_untrusted_request_fields_cannot_mutate_the_owners_operator_inputs",
]
note = "Tested only against the stand-in (ouro-fixture tests/harness_gate.rs). Owned by J5-B1."

[[clause]]
id = "I03.4"
gate = "I03"
clause = "Untrusted request fields cannot mutate the owner's operator inputs"
tag = "live-cli"
tests = [
  "ouro-jail/tests/j5_process_linux.rs::i03_untrusted_request_fields_cannot_mutate_the_owners_operator_inputs",
]
note = "The untrusted request's argv (operator-flag look-alikes after --) leaves the owner's planned policy unchanged; its project file selecting a profile refuses before prepared; one that only narrows is caught by the owner's plan and nothing runs."

