note = "A 2s wall fires on time (wall_expiry, hit, elapsed < 9s) while a Never trace consumer fills the pipe and the 4 MiB external queue behind it (the boundary frame is written in part; the excess is lost). Enforcement: the nonblocking external trace fd (trace.rs FdSink::from_raw_fd set_nonblocking); a blocking fd hangs the supervision loop on the full pipe and the wall never fires (harness timeout) — verified RED on the host. Complements j4_trace_linux's saturation tests with a best-effort + recognisable-prefix assertion. A guaranteed-torn partial write to the output pipe needs a smaller pipe (harness-owned) or a larger-than-pipe event / FdSink seam (trace.rs, J5-C-owned); see B2/requests.md."

