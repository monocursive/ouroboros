note = "A same-uid child overwrites the attempt's receipt (jail.json), trace sink (trace.ndjson) and jail state (jail-state.json) WHILE a none run is live, then exits 0; the run's own outcome is exactly what it would be without the forgery (settles, exits 0, tree verified) and its records still make no protection claim (unprotected), with no error and no note reporting the tampering — none offers no local evidence assurance against a same-uid peer (§9.3). Strengthens conformance_j3_none::r05_same_uid_tampering (which forges only the static policy.json). Mutation-provable anchor: the none unprotected labeling (records.rs Containment::None => ChildProtection::Unprotected); upgrading none to Enforced reddens the unprotected assertion (verified RED on host). R05 is about the absence of assurance, so the test also asserts the product does not falsely claim to have detected the forgery."

