clause = "Every detected escape retains its state (leaf and vendor state)"
tag = "live-cli"
tests = [
  "ouro-jail/tests/j5_boundary_linux.rs::r06_a_detected_escaped_descendant_loses_integrity_and_retains_state",
]
note = "In the detected-escape case the registered leaf is retained and is the pinned inode (not a look-alike), and the attempt's records are retained (state_cleanup != complete). none stages no vendor state (it refuses --launch), so there is no vendor state on the detected-escape path; vendor-state retention on an integrity loss is a contained-profile concern, proved by portable_launch::rm11_a_teardown_that_lost_integrity_retains_vendor_state_and_says_why. Mutation-provable via uncontained.rs self.leaf.retain() (removed -> the leaf is cleaned, RED on host)."

[[clause]]
id = "R06.3"
gate = "R06"
clause = "An unobserved migrated descendant is not certified dead by registered-boundary verification"
tag = "recorded-limit"
tests = [
  "ouro-jail/tests/conformance_j3_none.rs::r05_clean_none_evidence_stays_unprotected",
  "ouro-jail/tests/conformance_j3_none.rs::none_gate_closed_refuses_after_a_verified_teardown",
  "ouro-jail/src/lib.rs::platform::linux::uncontained::tests::a_clean_none_tree_is_empty_only_in_the_registered_scope",
]
limit = "docs/specs/jail-v1/j5-authority.md § Known gaps: A test cannot migrate a descendant out of the registered cgroup without the supervisor being able to see it: an unseen migration is a race jail-v1 §9.3 declines to promise to detect."
note = "R06's THIRD sentence, 'an unobserved migrated descendant is not certified dead by registered-boundary verification', is not producible as a deterministic live fixture on the stock host: with observation off the subreaper + zombie-cgroup checks detect every escape, and the genuinely-unseen case is a race §9.3 explicitly declines to promise. It is proved by the honest scope label on the verified path: tree_empty=true is recorded with verification_scope=registered_boundary, which by §9.3 does not certify processes outside the identity-checked cgroup dead. The listed tests assert that label (and the unit test the verdict)."

[[clause]]
id = "R06.6"
gate = "R06"
clause = "Under none, a process the supervisor was started beside is not an attempt descendant: it is never a membership escape and is never reaped or signalled, with observation on or off"
tag = "live-cli"
tests = [
  "ouro-jail/tests/j5_tracer_foreign_child_linux.rs::j5t_none_leaves_an_inherited_child_alone_observed",
  "ouro-jail/tests/j5_tracer_foreign_child_linux.rs::j5t_none_leaves_an_inherited_child_alone_unobserved",
  "ouro-jail/tests/j5_tracer_foreign_child_linux.rs::j5t_none_traced_to_an_inherited_reader_delivers_the_whole_stream",
  "ouro-jail/tests/j5_tracer_foreign_child_linux.rs::j5t_none_unobserved_an_inherited_child_ending_mid_run_is_not_an_escape",
]
note = "Each run exits 0 and settles with integrity not lost and tree_empty true; a child that lives through the run is alive afterwards, a --trace-fd reader sees EOF and the whole stream, and one that ends mid-run under observe off is not reaped as an escape. Red on 91a347ad: refused 125 (\"the registered boundary or the blocked launcher was lost before release\" or the observer probe) and the child killed. Not covered, and not claimed: a process born into such a child's subtree after the launcher starts and orphaned to the subreaper supervisor is indistinguishable from an escaped attempt process (uncontained.rs module doc; spec proposal J5-T.3)."

