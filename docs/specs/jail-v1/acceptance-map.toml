note = "From inside tool/build/agent/none the child probes every process it can address (its own /proc and every ancestor up the PPid chain): pidfd_getfd against each of the target's first descriptors and ptrace(PTRACE_SEIZE) both fail. For the contained profiles the child's /proc is its own pid namespace only (bwrap init, and under agent the launcher/bridge), so the supervisor/observer are not addressable; for none the ancestor chain reaches the supervisor (comm ouro-jail) and the calls still fail EPERM. Mutation-provable anchor: the jail's capability drop — the child's CapEff/CapPrm/CapInh/CapAmb are empty; adding CAP_SYS_PTRACE via bwrap --cap-add with the CapEff verify disabled reddens it (verified RED on host). The pidfd_getfd/ptrace denials are kernel-enforced defence in depth (Yama, user-namespace credential mapping, and the baseline seccomp ptrace deny for contained profiles) on top of that empty set. Fixes the B1 test that never called pidfd_getfd and targeted a pid absent from the child's namespace."

