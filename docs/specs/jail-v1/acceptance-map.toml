note = "The trigger, a leaf without the pids controller, is not producible through ouro-jail run on the stock host (the cited record): the leaf is always made directly beneath user@<uid>.service, whose cgroup.subtree_control enables pids and is shared by every session and service of the account. The listed test proves the recording through the command line with no leaf at all (the leaf's name taken by an owner-bound attempt id): the preferred pids row required false, applied false, null mechanism, scope and hit; the reason in native details; a wrapper limit note naming pids; the run proceeds. The controller-absent branch itself is L03.1/L03.2's library test."

