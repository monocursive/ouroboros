note = "The release binary is aborted by OURO_JAIL_TEST_ABORT_AT=<site>:<point>[:<n>] (S9; J5-C added the ordinal n, the nth replacement at the site in one process, so records that are never a process's first at their site are reachable) at all 4 points of: P7 (a live none escape), both P12 writes (the receipt gc completes, then jail state), P13 (a dead agent's proxy directory) and each P14 record of one pass over a dead none supervisor's populated leaf (gc_terminating_orphan, gc_terminated_orphan, gc_removing_cgroup, gc_removed_cgroup, gc_finished) and a dead tool supervisor's empty leaf and scratch (gc_removing_cgroup, gc_removed_cgroup, gc_removed_scratch, gc_finished): 52 crashes. Each: records parse, jail.json passes the frozen contract, the replaced record is the prior one before the rename and the new one after it, the kill/rmdir/removal is on the side of its record the order promises, the temporary files are exactly the crashed replacement's, and the next gc pass finishes keeping every record. The seam only picks the point; the crash is a real abort."

