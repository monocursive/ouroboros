tests = [
  "ouro-jail/tests/j5_lifetime_linux.rs::l04_the_execution_wall_follows_the_boot_clock_across_a_suspend_sized_jump",
  "ouro-jail/tests/j5_lifetime_linux.rs::l04_the_gate_wait_follows_the_boot_clock",
]
note = "The boot, monotonic and real-time clocks are equal on the reference host (never suspended, never set), so an LD_PRELOAD clock_gettime shim makes them differ inside the real ouro-jail run: advancing only CLOCK_BOOTTIME by 120 s expires the 20 s execution wall and the 60 s gate budget within 8 s of the jump, which a deadline on CLOCK_MONOTONIC or CLOCK_REALTIME would not do. The preparation budget shares the gate's clock code (21ff0362) and has no test of its own: no stock-host fixture holds preparation open."

[[clause]]
id = "L04.5"
gate = "L04"
clause = "BOOTTIME deadlines ignore wall-clock adjustments"
tag = "simulated"
tests = [
  "ouro-jail/tests/j5_lifetime_linux.rs::l04_the_execution_wall_ignores_wall_clock_steps",
]
note = "A real clock step needs CAP_SYS_TIME. The real ouro-jail run is started with an LD_PRELOAD clock_gettime shim that, from exec on, steps only CLOCK_REALTIME by +1 h (and, in a second run, -1 h); the 6 s wall still expires between 3 s and 16 s after exec on the test's own unshifted clock, cause wall_expiry, mechanism boottime-deadline. Red under M12b (boottime_ns reads CLOCK_REALTIME). The kernel's own clock-step path is not exercised (j5-authority.md, Known gaps)."

[[clause]]
id = "L04.6"
gate = "L04"
clause = "BOOTTIME deadlines include suspend"
tag = "simulated"
tests = [
  "ouro-jail/tests/j5_lifetime_linux.rs::l04_the_execution_wall_follows_the_boot_clock_across_a_suspend_sized_jump",
]
note = "A real suspend cannot be produced on the shared reference VM. The shim advances only CLOCK_BOOTTIME by 120 s right after exec (a suspend's signature: the boot clock moves, the monotonic clock does not); the 20 s wall expires within 8 s of the jump (measured ~15 ms), cause wall_expiry. Red under M12 (boottime_ns reads CLOCK_MONOTONIC) and M12b. The gate wait follows the boot clock too since 21ff0362 (L04.4). The kernel's own suspend path, timers acted on at resume, is not exercised (j5-authority.md, Known gaps)."

