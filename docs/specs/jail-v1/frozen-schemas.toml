# Current pre-release contract baseline. This project is not live; per the
# jail v2 preamble (§0), a frozen schema or artifact may be re-blessed in
# place under the same identifier: the recorded SHA-256 is regenerated
# together with its fixtures and validators in one reviewable commit, and
# historical milestone evidence remains historical, not proof for this tree.
#
# Re-blessing record:
# - 2026-10-15 re-blessed every frozen schema and artifact for the rename from
#   Ouroboros to Ukai: each `ouro.*` identifier became `ukai.*` and each
#   `urn:ouro:schema:*` `$id` became `urn:ukai:schema:*`, with the receipt,
#   policy and argv digests in the fixtures recomputed for the new domain
#   strings. No field changed meaning. Evidence recorded before the rename
#   keeps the old identifiers; validate_contract.py reads its receipts
#   through that rename.
# - 16336791 re-blessed jail-receipt.schema.json and
#   policy-snapshot.schema.json in place under their existing identifiers
#   (ukai.jail.receipt/1, ukai.jail.policy-snapshot/1). Rationale: additive
#   fields only — the swap, storage and inodes limit ceilings (new snapshot
#   fields; new receipt limit-row kinds, with the receipt's limit-row
#   maximum raised from 4 to 7) plus their enforcement-loss handling. No
#   shared field changed meaning, so no new identifier was required.
# - audit 2026-10-08 (L21) re-blessed network-rules.md in place under
#   ukai.jail.network/1. Rationale: the §Normalization text now states the
#   enforced rule — plaintext HTTP requires a grant that named its port
#   explicitly; the omitted-port expansion to 443 is the TLS shape. The
#   wire vocabulary (ukai.jail.network/1) is unchanged; the change brings
#   the prose in line with what the proxy enforces.
# - 2026-10-10 re-blessed policy-snapshot.schema.json in place under
#   ukai.jail.policy-snapshot/1. Rationale: additive field only — a vault
#   credential may declare the header its placeholder belongs in (`header`
#   with `name` and an optional `prefix`, issue draft 08). No shared field
#   changed meaning.
# - 2026-10-10 re-blessed jail-receipt.schema.json in place under
#   ukai.jail.receipt/1. Rationale: additive field only — a coverage entry
#   may carry `resolver_refused`, counting proxy connections refused for
#   resolver capacity separately from policy denials (issue draft 04). No
#   shared field changed meaning.
# - 2026-10-10 re-blessed jail-event.schema.json in place under
#   ukai.event/1. Rationale: additive branch only — a classified path may be
#   `root_relative` to a named root (an operator grant or a system read-only
#   root, issue draft 10). The denial rules also admit write-class
#   EROFS/EBUSY and mediated EACCES/EPERM net.connect results, matching
#   the producer while retaining prior valid event shapes.

# - 2026-10-13 re-blessed policy-snapshot.schema.json and canonicalization.md in place:
#   additive optional vault paths, executable bindings and OAuth2 refresh.
#   Existing serialized vault policies retain their bytes; historical
#   benchmark evidence is preserved without mutation.
# - 2026-10-14 re-blessed fixtures/semantic-cases.json in place. Rationale:
#   citation prose only — the "rules" citations named lines of an old
#   revision of jail-v1.md, which no longer said what they cited; each now
#   names a section and quotes its text, and both validators check every
#   quote is in the cited section. No case, verdict or rule identifier
#   changed, so no shared field changed meaning.
# - 2026-10-14 re-blessed policy-snapshot.schema.json, jail-receipt.schema.json,
#   canonicalization.md and network-rules.md in place under their existing
#   identifiers (ukai.jail.policy-snapshot/1, ukai.jail.receipt/1,
#   ukai.jail.policy/1, ukai.jail.network/1). Rationale: additive fields
#   only — an optional snapshot set `network.tls_only` (omitted when empty)
#   and an optional receipt list `applied.network.tls_only` name the allow
#   rules every grant of which omitted its port, the bit that decides
#   whether plaintext HTTP is admitted (L21) and that the canonical
#   `host:port` spelling cannot carry. network-rules.md states where the
#   proxy enforces that shape and that a tunnel to an address is not
#   inspected. No shared field changed meaning: a policy with no
#   omitted-port grant keeps its bytes and digest, and one with such a
#   grant now digests that grant's shape.
# - 2026-10-16 (J13, jail-launch-and-summary.md §4 and §7 decisions 5 and
#   8) re-blessed jail-event.schema.json in place under ukai.event/1 and
#   froze the new jail-summary.schema.json as ukai.jail.summary/1.
#   Rationale: additive only. A proxy result may carry `fields.credentials`,
#   the ids (never values, placeholders or digests) of the vault credentials
#   whose placeholder the proxy replaced in a request head it sent upstream
#   whole, and `fields.credentials_unconfirmed`, those substituted into a
#   head it began to send without the whole being confirmed sent; each
#   sorted and unique, absent when empty, and never on a denied result,
#   which the proxy refused before sending any of it (the vault's TLS lane
#   now records a request that failed after its head began to go out as
#   allowed, with the failure as its reason and end, as the plain lane
#   already did). A credential lifecycle note may carry
#   `uses_recorded: true`, which tells a reader the build records those ids
#   (the receipt's `jail.version` cannot, since every build reports the
#   same one), and its existing `credential_id` and `transition` are now
#   stated. A run without a vault journals the frames it did before. New
#   examples: event-proxy-vault.json, event-note-credential.json and
#   summary-agent.json (product output). No shared field changed meaning.
schema = "ukai.jail.frozen-schemas/1"
milestone = "milestone-1"

