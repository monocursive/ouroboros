# The frozen wire schemas of jail v1, milestone 1 (jail-v1 §13, §17).
#
# jail-v1 §13: "After freeze, a breaking semantic change needs a new schema
# identifier." Each entry pins one schema file by its bytes. A test
# (crates/ouro-jail/tests/portable_version.rs) and validate_contract.py fail
# when a frozen file's sha256 differs from the one recorded here:
#
# - the file still declares its frozen `$id`: the change is refused. Revert
#   it; a breaking change gets a new `$id` (`...:2`) and wire identifier
#   (`.../2`), which is a new entry here, not an edited one;
# - the file declares a new `$id`: record the new file as its own entry.
#
# Every `*.schema.json` beside this file is either `[[frozen]]` or listed as
# `[[unfrozen]]` with the reason it is not a milestone-1 wire record.
# `identifier` is the wire `schema` value the records carry and `version
# --json` announces; the producer restriction carries the envelope's.
#
# The same sha256s are recorded in the milestone freeze file
# (milestone-1-freeze.toml) and the milestone report.

schema = "ouro.jail.frozen-schemas/1"
milestone = "milestone-1"

# §13.1: the shared source-event envelope
[[frozen]]
file = "event.schema.json"
id = "urn:ouro:schema:event:1"
identifier = "ouro.event/1"
sha256 = "a8150159c5d368ea4183e4898a4e7dd37f36eb64a360a239c2737d86547c1d4c"

# §13.1: the jail producer's restriction of ouro.event/1 (no identifier of its own)
[[frozen]]
file = "jail-event.schema.json"
id = "urn:ouro:schema:jail-event:1"
identifier = "ouro.event/1"
sha256 = "46f7763e8f15d0969dca092b0cdf1a978dbf5cc61a17e05c7ecbfd82bffba24b"

