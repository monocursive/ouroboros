# Current pre-release contract baseline. This project is not live; per the
# jail v2 preamble (§0), a frozen schema or artifact may be re-blessed in
# place under the same identifier: the recorded SHA-256 is regenerated
# together with its fixtures and validators in one reviewable commit, and
# historical milestone evidence remains historical, not proof for this tree.
#
# Re-blessing record:
# - 16336791 re-blessed jail-receipt.schema.json and
#   policy-snapshot.schema.json in place under their existing identifiers
#   (ouro.jail.receipt/1, ouro.jail.policy-snapshot/1). Rationale: additive
#   fields only — the swap, storage and inodes limit ceilings (new snapshot
#   fields; new receipt limit-row kinds, with the receipt's limit-row
#   maximum raised from 4 to 7) plus their enforcement-loss handling. No
#   shared field changed meaning, so no new identifier was required.
# - audit 2026-10-08 (L21) re-blessed network-rules.md in place under
#   ouro.jail.network/1. Rationale: the §Normalization text now states the
#   enforced rule — plaintext HTTP requires a grant that named its port
#   explicitly; the omitted-port expansion to 443 is the TLS shape. The
#   wire vocabulary (ouro.jail.network/1) is unchanged; the change brings
#   the prose in line with what the proxy enforces.

