# The frozen wire contract of jail v1, milestone 1 (jail-v1 §13, §17).
#
# jail-v1 §13: "After freeze, a breaking semantic change needs a new schema
# identifier." Each entry pins one file by its bytes. A test
# (crates/ouro-jail/tests/portable_version.rs) and validate_contract.py fail
# when a frozen file's sha256 differs from the one recorded here.
#
# The rule: a frozen file whose bytes change is a new identifier. Revert the
# change, or give what the file defines a new identifier (a schema: a new
# `$id` `...:2` and wire identifier `.../2`) and record the new file as a new
# entry. An entry is never re-blessed in place. Nothing in a file can prevent
# someone editing both a frozen file and its sha256 here; that edit is visible
# in review, and by this rule it is a violation, not a re-bless.
#
# `[[frozen]]`: every `*.schema.json` beside this file is either frozen here
# or listed as `[[unfrozen]]` with the reason it is not a milestone-1 wire
# record, and no two schema files declare one `$id`. `identifier` is the wire
# `schema` value the records carry and `version --json` announces; the
# producer restriction carries the envelope's.
#
# `[[frozen_artifact]]`: the files that define the announced identifiers no
# schema states: the policy digest domain and policy file (canonicalization.md
# and its golden fixtures), the network rule set, the gate frame rules, and
# the record rules no schema can state (the semantic corpus and the instances
# it changes). Every identifier `version --json` announces is backed by a
# frozen schema or a frozen artifact. The checkers that run the corpora
# (ouro_jail::records::semantic, validate_contract.py) are code, not frozen by
# bytes: the corpus is their contract, and both must give every case its
# recorded verdict.
#
# The same schema sha256s are recorded in the milestone freeze file
# (milestone-1-freeze.toml) and the milestone report.

schema = "ouro.jail.frozen-schemas/1"
milestone = "milestone-1"

# §13.1: the shared source-event envelope
[[frozen]]
file = "event.schema.json"
id = "urn:ouro:schema:event:1"
identifier = "ouro.event/1"
sha256 = "f11a51654753f9db14bede36a33abee5a7fbfbb66901a9175fd7cd3e45296384"

