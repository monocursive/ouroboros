# Operator-owned starter; copy to <config-dir>/launch/opencode-vault.toml,
# mode 0600. Use a private raw key file with no trailing newline; keep it
# outside all child grants. Grant your client and libraries read-only.
# Map the placeholder inside the contained command:
# /bin/sh -c 'export ANTHROPIC_API_KEY="$OURO_VAULT_ANTHROPIC"; exec opencode "$@"' vault-client ...
# These destinations match the frozen Anthropic benchmark, not every provider.
name = "opencode-vault"
jail = "agent"
home_is_state = true
state_subdirs = ["config/opencode", "data/opencode", "cache/opencode", "state/opencode"]

[environment]
OPENCODE_DISABLE_AUTOUPDATE = "true"
XDG_CONFIG_HOME = { state = "config" }
XDG_DATA_HOME = { state = "data" }
XDG_CACHE_HOME = { state = "cache" }
XDG_STATE_HOME = { state = "state" }

[credentials.anthropic]
mode = "vault"
source = "~/.config/ouro/credentials/anthropic"
hosts = ["https://api.anthropic.com"]
header = { name = "x-api-key" }

[network]
allow = ["api.anthropic.com:443", "models.opencode.ai:443", "opencode.ai:443"]
