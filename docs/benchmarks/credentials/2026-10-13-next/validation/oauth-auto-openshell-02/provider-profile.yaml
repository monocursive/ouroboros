id: oauth-db1d63dc0c7c
display_name: Matched OAuth refresh
category: other
credentials:
  - name: access_token
    env_vars: [BENCH_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: http://127.0.0.1:45657/token
      refresh_before_seconds: 75
      max_lifetime_seconds: 180
      material:
        - name: client_id
          required: true
        - name: refresh_token
          required: true
          secret: true
endpoints:
  - host: 37.59.114.70
    port: 34607
    path: /v1/**
    protocol: rest
    access: read-write
    enforcement: enforce
    allowed_ips: [37.59.114.70/32]
binaries: [/usr/bin/python3.12]
