version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /etc
    - /dev/urandom
    - /var/log
  read_write:
    - /work
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  _provider_matched_http_04:
    name: _provider_matched_http_04
    endpoints:
      - host: '37.59.114.70'
        path: /v1/**
        port: 34467
        protocol: rest
        enforcement: enforce
        access: read-write
        allowed_ips:
          - '37.59.114.70/32'
    binaries:
      - path: /usr/bin/python3.12