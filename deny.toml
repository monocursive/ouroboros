# Pinned dependency policy, enforced by the `rust` workflow's cargo-deny
# step (bans, licenses, advisories).

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[advisories]
# cargo-deny 0.20 uses dependency scope here rather than a lint level.
unmaintained = "all"
