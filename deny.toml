# Pinned dependency policy, enforced by the `rust` workflow's
# dependency-policy job (bans, licenses, advisories, sources).

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

# Every dependency comes from crates.io; a new registry or git source is a
# reviewed change to this file, not a side effect of a Cargo.toml edit.
[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# cargo-deny 0.20 uses dependency scope here rather than a lint level.
unmaintained = "all"

# The compiled Mozilla CA data used to validate vault upstream TLS. Its
# redistribution text ships with local packages; this is not a blanket waiver.
[[licenses.exceptions]]
name = "webpki-roots"
version = "=1.0.9"
allow = ["CDLA-Permissive-2.0"]

# Frozen-schema validation now runs in the ledger, so this previously test-only
# URI helper enters the runtime graph. Its checked-in MIT No Attribution text
# permits redistribution; keep the exception confined to the locked version.
[[licenses.exceptions]]
name = "borrow-or-share"
version = "=0.2.4"
allow = ["MIT-0"]
