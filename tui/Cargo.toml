[workspace]
members = [".", "computer-use", "sandbox"]

[package]
name = "ouro"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Terminal client for an Ouroboros runtime"
publish = false

[[bin]]
name = "ouro"
path = "src/main.rs"

[features]
default = []
# Compiles the release extractor. The embedded bytes themselves arrive separately, via
# OUROBOROS_RELEASE_TARBALL at build time, so the extractor stays testable without a
# `mix release` having run.
embed = ["dep:flate2", "dep:tar", "dep:sha2"]

[dependencies]
anyhow = "1"
# Already in this tree twice over (`rcgen`, `x509-parser`); named directly because
# `dist/release.pub` and a `.minisig` are base64 and nothing else in this crate decodes
# it. No new crate enters the dependency graph.
base64 = "0.22"
# The one addition `ouro update` needed. Current `minisign` signs the BLAKE2b-512 hash of
# a file rather than the file, so verifying a signature the release pipeline actually
# produces means computing that hash; `ring` (already here, and what does the Ed25519
# verification) has no BLAKE2b. RustCrypto's implementation is pure Rust with no C and no
# OpenSSL, and every crate under it — `digest`, `block-buffer`, `crypto-common`,
# `generic-array`, `typenum` — was already in the lock behind `sha2`.
blake2 = "0.10"
clap = { version = "4", features = ["derive"] }
# Pinned to the version `ratatui` itself re-exports. Two crossterm majors in one tree
# would compile, and then the backend would refuse the terminal handle this crate owns.
crossterm = "0.29"
dirs = "6"
libc = "0.2"
ratatui = "0.30"
# The Markdown parser behind agent prose. `default-features = false` drops the crate's
# `html` renderer and its `getopts` CLI: this client never emits HTML and never reads a
# file through it, so what is left is a pull parser over a `&str` — no I/O, no network,
# and nothing that allocates the whole document at once. 0.13 is the first line that
# tracks CommonMark 0.31.2, which is the spec the agents on the other end write to.
pulldown-cmark = { version = "0.13", default-features = false }
rand = { version = "0.9", default-features = false, features = ["os_rng"] }
rcgen = { version = "0.13.2", features = ["x509-parser", "zeroize"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The client's own config file, and nothing else. Default features only: `preserve_order`
# would make the written file's key order depend on an index map rather than on the
# structs below, and a config this client rewrites should diff as a one-line change.
toml = "0.9"
# The same two crates `ratatui` measures and segments with, named directly because this
# client wraps and truncates its own text: a transcript whose scroll offset counts
# characters where the terminal counts cells is a transcript that clips CJK and emoji.
unicode-segmentation = "1"
unicode-width = "0.2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "process",
  "signal",
  "io-util",
  # `ouro mcp-serve` speaks a line protocol on this process's own stdin and stdout.
  "io-std",
  "time",
  "sync",
  "macros",
] }
zeroize = "1"
x509-parser = { version = "0.16", features = ["verify"] }

# The `embed` feature's three crates. They belong in the platform-independent table, and
# once did not: this crate used to carry a `[target.'cfg(target_os = "macos")'.dependencies]`
# table for the desktop client's `cocoa`, and a blank line does not end a TOML table, so
# while these three sat after that header they were macOS-only dependencies and
# `cargo build --features embed` on Linux compiled `src/runtime/embed.rs` against three
# crates that were not in the graph, failing on every one of them. `make dist` on the
# release workflow's `ubuntu-24.04` runner would have hit exactly this; `make dist-linux`
# is what actually hit it. The macOS table left with the desktop client; keep these here.
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }

[build-dependencies]
sha2 = { version = "0.10", optional = true }

[profile.release]
strip = true
