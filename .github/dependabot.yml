# One PR per stale dependency, weekly, across all four ecosystems this repository
# actually builds with.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /tui
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
