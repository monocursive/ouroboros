# The UTS 46 tables are generated, so the checked-in Rust must be exactly what
# the generator makes from its pinned Unicode 17.0.0 inputs. Runs when the
# generator or the tables change; nothing else can change them.
name: uts46
on:
  push:
    branches: [dev, main]
    paths: ['crates/ukai-jail/data/**', '.github/workflows/uts46.yml']
  pull_request:
    paths: ['crates/ukai-jail/data/**', '.github/workflows/uts46.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uts46-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the generator's pinned inputs
        # The URLs come from the generator's own pin table; the generator
        # checks each file's SHA-256 before using it.
        run: |
          mkdir -p "$RUNNER_TEMP/ucd17"
          python3 - "$RUNNER_TEMP/ucd17" <<'PY'
          import runpy, sys, urllib.request
          from pathlib import Path
          pins = runpy.run_path('crates/ukai-jail/data/gen_uts46_tables.py')['PINS']
          for name, (url, _) in pins.items():
              with urllib.request.urlopen(url, timeout=60) as response:
                  (Path(sys.argv[1]) / name).write_bytes(response.read())
          PY
      - name: Regenerate and compare with the checked-in tables
        run: |
          python3 crates/ukai-jail/data/gen_uts46_tables.py "$RUNNER_TEMP/ucd17" "$RUNNER_TEMP/tables.rs"
          diff -u crates/ukai-jail/data/uts46_unicode17_tables.rs "$RUNNER_TEMP/tables.rs"
