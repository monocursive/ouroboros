# The provisioned Linux conformance job (jail-v1 §3.2, §16). A GitHub-hosted runner
# drives the reference host over SSH as the dedicated non-sudo account; no runner
# agent lives on the host and nothing there polls GitHub. Fork pull requests have
# no secrets and cannot reach the host, so this runs only on pushes to dev/main and
# on manual dispatch. It is a no-op until the repository is configured with:
#   variables: UKAI_CI_HOST (address), UKAI_CI_USER (account), UKAI_CI_KNOWN_HOSTS
#              (one `ssh-keyscan -t ed25519 <host>` line)
#   secret:    UKAI_CI_SSH_KEY (private key authorized for that account only)
# The pre-rename OURO_CI_* settings remain valid until the provisioned
# repository variables and secret have been migrated together.
name: conformance
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conformance-reference-host
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  # §16 makes a skipped required capability a failure; a wholly unconfigured
  # host cannot run at all, but the skip must be loud, not a green silence.
  not-configured-notice:
    if: vars.UKAI_CI_HOST == '' && vars.OURO_CI_HOST == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Announce that conformance cannot run
        run: |
          {
            echo "## ⚠️ conformance did not run"
            echo
            echo "Neither UKAI_CI_HOST nor the legacy OURO_CI_HOST is configured, so the reference-host job was"
            echo "skipped. A green push without this job proves nothing about the"
            echo "live kernel features (jail-v1 §16). Configure UKAI_CI_HOST,"
            echo "UKAI_CI_USER, UKAI_CI_KNOWN_HOSTS and UKAI_CI_SSH_KEY."
          } >> "$GITHUB_STEP_SUMMARY"
  reference-host:
    if: vars.UKAI_CI_HOST != '' || vars.OURO_CI_HOST != ''
    runs-on: ubuntu-24.04
    # A wedged SSH session must fail the job, not hold the serialized lane.
    timeout-minutes: 45
    env:
      CI_HOST: ${{ vars.UKAI_CI_HOST || vars.OURO_CI_HOST }}
      CI_USER: ${{ vars.UKAI_CI_USER || vars.OURO_CI_USER }}
    steps:
      # This job holds the reference-host key, so the checkout keeps no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: SSH identity
        env:
          KEY: ${{ secrets.UKAI_CI_SSH_KEY || secrets.OURO_CI_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.UKAI_CI_KNOWN_HOSTS || vars.OURO_CI_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ukai_ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Install the pinned toolchain
        # Only needed to build the driver itself; the suite is built on the host.
        run: rustup toolchain install && rustup show
      # The driver runs the contract validator (validate_contract.py) at the
      # same revision and records its output as evidence (R01); it needs uv.
      # Third-party toolchain installer, so pinned to a commit like the rest.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Conformance suite
        # The xtask driver validates the contract locally, copies the tree to a
        # per-run directory on the host, builds it, runs `doctor --json`
        # against the expected-capability manifest, runs the plain-session
        # smoke leg (a `tool` run, a `none` run and `doctor` with no
        # systemd-run around them), probes I01 (no ledger, fleet or BEAM),
        # collects the host manifest (evidence/host-manifest.txt, its only
        # writer),
        # runs the suite with UKAI_CONFORMANCE=1 so a skipped live capability
        # fails the job (jail-v1 §16) and with PATH scrubbed to the system
        # directories, and copies the evidence back. It then evaluates
        # docs/specs/jail-v1/acceptance-map.toml over the suite's own log and
        # fails when any §15 gate clause in its lane fails (evidence/gates.txt,
        # gates.json). It removes the remote run directory on success and
        # keeps it, with the path printed, on failure.
        #
        # No `if:` guards this step: a condition that silently disarmed the
        # only conformance step (a moved file, say) would be worse than the
        # failure it avoided (§16).
        run: |
          cargo run -p xtask -- conformance \
            --linux-release \
            --host "$CI_HOST" --user "$CI_USER" \
            --key ~/.ssh/ukai_ci --known-hosts ~/.ssh/known_hosts \
            --evidence evidence/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: reference-host-evidence-${{ github.run_id }}
          path: evidence/
