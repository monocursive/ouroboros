# The provisioned Linux conformance job (jail-v1 §3.2, §16). A GitHub-hosted runner
# drives the reference host over SSH as the dedicated non-sudo account; no runner
# agent lives on the host and nothing there polls GitHub. Fork pull requests have
# no secrets and cannot reach the host, so this runs only on pushes to dev/main and
# on manual dispatch. It is a no-op until the repository is configured with:
#   variables: OURO_CI_HOST (address), OURO_CI_USER (account), OURO_CI_KNOWN_HOSTS
#              (one `ssh-keyscan -t ed25519 <host>` line)
#   secret:    OURO_CI_SSH_KEY (private key authorized for that account only)
name: conformance
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: conformance-reference-host
  cancel-in-progress: false
jobs:
  # §16 makes a skipped required capability a failure; a wholly unconfigured
  # host cannot run at all, but the skip must be loud, not a green silence.
  not-configured-notice:
    if: vars.OURO_CI_HOST == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Announce that conformance cannot run
        run: |
          {
            echo "## ⚠️ conformance did not run"
            echo
            echo "OURO_CI_HOST is not configured, so the reference-host job was"
            echo "skipped. A green push without this job proves nothing about the"
            echo "live kernel features (jail-v1 §16). Configure OURO_CI_HOST,"
            echo "OURO_CI_USER, OURO_CI_KNOWN_HOSTS and OURO_CI_SSH_KEY."
          } >> "$GITHUB_STEP_SUMMARY"
  reference-host:
    if: vars.OURO_CI_HOST != ''
    runs-on: ubuntu-latest
    # A wedged SSH session must fail the job, not hold the serialized lane.
    timeout-minutes: 45
    env:
      CI_HOST: ${{ vars.OURO_CI_HOST }}
      CI_USER: ${{ vars.OURO_CI_USER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned by SHA: this job holds the reference-host key
      - name: SSH identity
        env:
          KEY: ${{ secrets.OURO_CI_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.OURO_CI_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ouro_ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Host manifest
        # Redirected, not piped: GitHub's default shell for `run:` is
        # `bash -e {0}` with no `pipefail`, so the step's status would be
        # `tee`'s and an unreachable host would leave an empty manifest and a
        # green step.
        run: |
          mkdir -p evidence
          ssh -i ~/.ssh/ouro_ci -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$CI_USER@$CI_HOST" 'bash -s' < docs/specs/jail-v1/host-manifest.sh \
            > evidence/host-manifest.txt
          cat evidence/host-manifest.txt
      - name: Install the pinned toolchain
        # Only needed to build the driver itself; the suite is built on the host.
        run: rustup toolchain install && rustup show
      # The driver runs the contract validator (validate_contract.py) at the
      # same revision and records its output as evidence (R01); it needs uv.
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6, pinned by SHA (third-party toolchain installer: highest-risk unpinned action)
      - name: Conformance suite
        # The xtask driver validates the contract locally, copies the tree to a
        # per-run directory on the host, builds it, runs `doctor --json`
        # against the expected-capability manifest, runs the plain-session
        # smoke leg (a `tool` run, a `none` run and `doctor` with no
        # systemd-run around them), probes I01 (no ledger, fleet or BEAM),
        # runs the suite with OURO_CONFORMANCE=1 so a skipped live capability
        # fails the job (jail-v1 §16) and with PATH scrubbed to the system
        # directories, and copies the evidence back. It then evaluates
        # docs/specs/jail-v1/acceptance-map.toml over the suite's own log and
        # fails when any §15 gate clause in its lane fails (evidence/gates.txt,
        # gates.json). It removes the remote run directory on success and
        # keeps it, with the path printed, on failure.
        #
        # The `hashFiles('Cargo.toml')` gate that used to guard this step is
        # gone: the workspace exists, and a condition that silently disarms the
        # only conformance step if the file is ever moved is worse than the
        # failure it was meant to avoid (§16).
        run: |
          cargo run -p xtask -- conformance \
            --host "$CI_HOST" --user "$CI_USER" \
            --key ~/.ssh/ouro_ci --known-hosts ~/.ssh/known_hosts \
            --evidence evidence/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4, pinned by SHA
        if: always()
        with:
          name: reference-host-evidence-${{ github.run_id }}
          path: evidence/
