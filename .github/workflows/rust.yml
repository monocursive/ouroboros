# Portable gates from jail-v1 §16. The macOS leg is the native build and refusal
# lane (M01–M03). The Ubuntu leg runs portable tests only and does not pretend to
# exercise privileged kernel features; that is the conformance workflow's job.
#
# A hosted runner has neither bubblewrap nor strace, so the live tests here skip
# themselves. §16 allows that ("without pretending they exercised a privileged
# kernel feature") but a green `ok` says nothing about what was not run, so the
# last step copies every `skipped:` line into the job summary. Set
# UKAI_CONFORMANCE=1 only where those tools exist; here a skip must stay a skip.
name: rust
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    # GitHub's `bash` runs with `-eo pipefail`, so a pipeline (the test step's
    # `tee`) reports the failing command, not its last one.
    shell: bash
jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        # Named images, not `-latest`: a runner upgrade is a reviewed change.
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # A hung test must fail the job, not hold the runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup show
      # Dependencies and the build cache, keyed by OS, toolchain and Cargo.lock.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # ring builds native C/assembly even during cargo check; minisign is
      # for the release-tooling tests.
      - name: Install Linux cross compiler and minisign
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu minisign
      # Platform compilation (jail-v1 §3.2): compile-only evidence for a
      # triple no runner executes, one per leg. Intel macOS is "additional
      # evidence, not an execution support claim"; Linux aarch64 execution
      # is validated separately on the native Raspberry Pi. This job proves
      # only compilation. `cargo check`, not clippy: some lints (a cast to
      # `c_char`, which is `u8` there) differ by target without being defects.
      # Nothing here runs, so nothing here is claimed as tested.
      - name: Cross-target check (compile only)
        env:
          RUSTFLAGS: -D warnings
        run: |
          case "$RUNNER_OS" in
            macOS) target=x86_64-apple-darwin ;;
            Linux) target=aarch64-unknown-linux-gnu ;;
            *) echo "no cross target for $RUNNER_OS"; exit 1 ;;
          esac
          rustup target add "$target"
          cargo check --workspace --all-targets --target "$target"
          echo "Compiled (not run): \`$target\`" >> "$GITHUB_STEP_SUMMARY"
      # jail-v1 §15 row I02: no vendor name in the execution core. No test
      # scans the tree itself, so without this step one would land green.
      - name: I02 vendor-name scan
        run: cargo run -p xtask -- i02-scan
      - name: Tests
        # One test thread: a ptrace tracer owns every waitpid in its process, so two
        # observer tests in parallel reap each other (the conformance driver pins
        # this too); the binaries also serialize themselves, this is the second wall.
        # The macOS leg runs in conformance mode (every live test there is
        # Linux-only, so nothing skips) and prints the markers that bind its log
        # to this revision, so its acceptance-map lane can be judged; the Ubuntu
        # leg must not: its live tests skip, which conformance mode fails.
        env:
          UKAI_CONFORMANCE: ${{ runner.os == 'macOS' && '1' || '' }}
        run: |
          {
            echo "ukai-suite-path=$PATH"
            echo "ukai-suite-revision=$(git rev-parse HEAD)"
            echo "ukai-suite-conformance=${UKAI_CONFORMANCE}"
            cargo test --workspace -- --test-threads=1 --nocapture
          } 2>&1 | tee test-output.txt
      # jail-v1 §15: the macOS-lane clauses of the acceptance map (M01, M03,
      # X02's usage errors), judged from this leg's own test output at this
      # revision. Linux clauses read `elsewhere`; the conformance workflow
      # judges them on the reference host.
      - name: Acceptance verdict (macOS lane)
        if: runner.os == 'macOS'
        run: cargo run -p xtask -- gates --linux-release --log macos=test-output.txt
      - name: Report what was not exercised
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo
            if [ -f test-output.txt ]; then
              # With one test thread a skip note lands on the test's own
              # line (`test x ... skipped: ...`), so match it anywhere.
              count=$({ grep -o 'skipped: .*' test-output.txt || true; } | wc -l | tr -d ' ')
              echo "Live tests skipped on this runner: **${count}**"
              if [ "$count" -gt 0 ]; then
                echo
                echo '```'
                grep -o 'skipped: .*' test-output.txt | sort | uniq -c
                echo '```'
                echo
                echo "These are not failures here: §16 lets a generic runner"
                echo "decline a privileged feature. They are listed so a green"
                echo "job does not read as coverage. The conformance workflow"
                echo "runs the same tests with UKAI_CONFORMANCE=1, where a skip"
                echo "fails the job."
              fi
            else
              echo "No test output was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  dependency-policy:
    # deny.toml is the pinned dependency policy (bans, licenses, advisories,
    # sources); this job makes it enforced rather than declared. Cargo.lock
    # resolves the same graph for every host, so one Linux run covers it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup show
      # Also caches ~/.cargo/bin, so cargo-deny is compiled only on a miss.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --workspace check bans licenses advisories sources
