name: fleet
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    # BEAM belongs only to the fleet lane. The Jail reference host must remain
    # free of it so I01 continues to prove independent composition.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: fleet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1.24.1
        with:
          otp-version: '27.3'
          elixir-version: '1.18.3'
          install-hex: false
          install-rebar: false
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
