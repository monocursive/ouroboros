name: Release

on:
  push:
    tags: ["v*"]
  # Retry a tag with gh workflow run release.yml --ref vX.Y.Z.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ELIXIR_VERSION: "1.20"
  OTP_VERSION: "29"
  RUST_VERSION: "1.95"
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, versions and release branch
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          version=$(python3 scripts/release.py check "$TAG")
          test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          if [[ "$version" = *-* ]]; then
            git merge-base --is-ancestor HEAD origin/dev || git merge-base --is-ancestor HEAD origin/main
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            git merge-base --is-ancestor HEAD origin/main
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Reuse the complete existing CI at the tagged commit. Publication needs this
  # result, not a potentially stale green check on a branch before the tag.
  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Select native Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
      - name: Build locked dependencies and embedded runtime
        run: |
          mix deps.get --check-locked
          make ouro
          git diff --exit-code
      - name: Smoke the packaged binary away from the checkout
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/release-smoke.py tui/target/release/ouro "$VERSION" "$TARGET"
          mkdir -p _build/release-assets
          cp tui/target/release/ouro "_build/release-assets/ouro-$VERSION-$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: _build/release-assets/ouro-*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [validate, ci, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialize the latest-version decision when different tags finish together.
    concurrency:
      group: release-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: _build/release-assets
      - name: Assemble complete release and checksums
        run: |
          python3 scripts/release.py collect "$TAG" --directory _build/release-assets
          cd _build/release-assets
          sha256sum --check SHA256SUMS
      - name: Publish complete draft (published versions are never overwritten)
        run: bash scripts/publish-release.sh
