# HONESTY NOTE: the configured repository remote is not a public GitHub release channel.
# No tag has executed this workflow and no artifact it describes has been produced by a
# hosted runner. The four-target matrix reflects a real constraint rather than an
# aspiration — see below — but the YAML itself is unproven. Linux outputs inherit the
# Ubuntu 24.04 GNU ABI, and macOS outputs remain unsigned/unnotarized until release
# credentials and the corresponding verified steps are added; README installation
# guidance states both boundaries.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ERTS is not cross-compiled. `mix release` bakes the runtime system of the machine that
  # ran it, and `ouro` carries that release inside itself, so a binary is only ever valid
  # for the OS and architecture that built it. That is the same identity constraint the
  # forge verifier enforces between a builder node and a core node, and it is why this is
  # a matrix of real machines rather than a cross-compile matrix.
  build:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            triple: aarch64-apple-darwin
          - runner: macos-15-intel
            triple: x86_64-apple-darwin
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: rustup toolchain install 1.88 --profile minimal --component rustfmt,clippy && rustup default 1.88

      - run: mix deps.get

      - name: Verify the tag names this application version
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(mix run --no-start -e 'IO.write(Mix.Project.config()[:version])')"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Mix application version $expected" >&2
            exit 1
          fi

      # A tag is also seen by the ordinary CI workflow, but release publication must not
      # race ahead of a failing CI job in another workflow. Gate every native artifact
      # with the same cross-language suite before it can enter the publish fan-in.
      - run: make test

      # `make dist` is the same target a laptop runs, on purpose: a release built by a
      # command CI alone knows is a release nobody can reproduce when it breaks. It emits
      # dist/ouro-<version>-<host triple>, and the host triple is the matrix triple
      # because the runner is the target.
      - run: make dist

      # The ordinary CI workflow also requires this on Linux, but a tag workflow must
      # carry its own publication gate rather than race a separate workflow. One native
      # Linux artifact is representative: the script boots the just-built packaged
      # binary three times and verifies mutual TLS, late formation, hub loss, crash
      # recovery, and exact lab-only cleanup before any matrix artifact can publish.
      - name: Gate publication on the packaged secure-fleet E2E
        if: ${{ matrix.triple == 'x86_64-unknown-linux-gnu' }}
        run: OURO_E2E_BIN="$PWD/tui/target/release/ouro" bash scripts/fleet-e2e.sh

      - name: Check the artifact is named for this target
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find _build/prod -maxdepth 1 -type f -name 'ouroboros-*.tar.gz' -print -quit)
          test -n "$archive"
          filename=${archive##*/}
          version=${filename#ouroboros-}
          version=${version%.tar.gz}
          test -f "dist/ouro-${version}-${{ matrix.triple }}"

      # The client is asked what it carries. A binary that cannot report its own embedded
      # release version has not proven it has one, and finding that out here is cheaper
      # than finding it out on somebody's laptop.
      - run: ./tui/target/release/ouro version

      - uses: actions/upload-artifact@v4
        with:
          name: ouro-${{ matrix.triple }}
          path: dist/ouro-*
          if-no-files-found: error

  # A workflow artifact is useful to CI and awkward for a person setting up another
  # machine. Once every native build succeeds, publish the four self-contained binaries
  # beside one checksum file on the tag's GitHub Release. `gh release create` is used
  # instead of a marketplace action so the publication boundary is visible here and uses
  # only GitHub's short-lived workflow token.
  publish:
    name: publish downloadable binaries
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # The tree is needed for dist/release.pub. The signature published beside the
      # checksums is only worth something if it can be checked against a key that did
      # *not* come from the release, so the key of record is the committed one — the same
      # bytes `ouro update` compiles into itself — and this job verifies its own output
      # against it before publishing anything.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: ouro-*
          path: dist
          merge-multiple: true

      - name: Verify the native matrix is complete and write checksums
        shell: bash
        run: |
          set -euo pipefail
          for triple in \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu
          do
            compgen -G "dist/ouro-*-${triple}" >/dev/null || {
              echo "missing Ouroboros binary for ${triple}" >&2
              exit 1
            }
          done
          (cd dist && sha256sum ouro-* > SHA256SUMS)

      # From Ubuntu's own archive rather than a downloaded binary, so this step does not
      # itself become an unverified download in the middle of a signing pipeline.
      - name: Install minisign
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          minisign -v

      # Fails closed twice over: no secret, or a dist/release.pub that was never
      # provisioned, and the release does not happen. An unsigned release published as
      # though it were a signed one is worse than no release, because every downstream
      # check is written on the assumption that the signature exists.
      - name: Sign SHA256SUMS with the release key
        env:
          OURO_RELEASE_SIGNING_KEY: ${{ secrets.OURO_RELEASE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OURO_RELEASE_SIGNING_KEY}" ]]; then
            echo "the repository secret OURO_RELEASE_SIGNING_KEY is not set" >&2
            echo "generate a key pair with 'minisign -G -W -p dist/release.pub -s ouro-release.key'," >&2
            echo "commit the public half, and store the secret half in that secret." >&2
            echo "See docs/DISTRIBUTION.md. Refusing to publish an unsigned release." >&2
            exit 1
          fi

          public=$(sed -e '/^[[:space:]]*#/d' \
                       -e '/^[[:space:]]*untrusted comment:/d' \
                       -e '/^[[:space:]]*$/d' \
                       dist/release.pub | head -n 1)

          if [[ -z "${public}" ]]; then
            echo "dist/release.pub carries no key: it is still the unprovisioned placeholder." >&2
            echo "A signature nobody can check against a committed key is not a signature." >&2
            echo "See docs/DISTRIBUTION.md. Refusing to publish." >&2
            exit 1
          fi

          key=$(mktemp -d)
          chmod 700 "${key}"
          trap 'rm -rf "${key}"' EXIT
          printf '%s\n' "${OURO_RELEASE_SIGNING_KEY}" > "${key}/ouro-release.key"
          chmod 600 "${key}/ouro-release.key"

          # `-W` keys carry no password, so this never prompts; </dev/null makes a
          # password-protected key fail immediately instead of hanging the job.
          # The trusted comment is covered by a second signature, so `ouro update` can
          # print it after verifying — which is why the tag goes in it.
          minisign -S \
            -s "${key}/ouro-release.key" \
            -m dist/SHA256SUMS \
            -t "ouroboros ${TAG} SHA256SUMS" \
            < /dev/null

          test -f dist/SHA256SUMS.minisig

          # The same check a user's machine will run, run here first: this catches a
          # secret that does not belong to the committed public key, which is otherwise
          # only discovered by whoever downloads the release.
          minisign -V -P "${public}" -x dist/SHA256SUMS.minisig -m dist/SHA256SUMS

          echo "signed dist/SHA256SUMS and verified it against the committed dist/release.pub"

      - name: Publish one immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to replace binaries or checksums under an existing version" >&2
            echo "publish a new application version and tag instead" >&2
            exit 1
          fi
          # Named explicitly rather than dist/*: the release must carry the binaries, the
          # checksums, and the signature, and must NOT carry dist/release.pub. A public
          # key downloaded from the same place as the signature it checks proves nothing;
          # the key of record is the one in the repository and in the binary.
          gh release create "$TAG" \
            dist/ouro-* \
            dist/SHA256SUMS \
            dist/SHA256SUMS.minisig \
            --verify-tag \
            --generate-notes \
            --title "Ouroboros ${TAG}"
