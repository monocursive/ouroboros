# Native preview packages; production signing and publication stay local.
name: release-candidate
on:
  push:
    tags: ['ukai-jail-v*']
  workflow_dispatch:
    inputs:
      version:
        # No default: a new candidate needs a new version, and the current
        # one is recorded in crates/ukai-jail/dist/release.json.
        description: 'Preview version without the ukai-jail-v prefix'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  coordinate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'crates/ukai-jail/dist')
          from package import VERSION
          version = (os.environ['GITHUB_REF_NAME'].removeprefix('ukai-jail-v')
                     if os.environ['GITHUB_REF_TYPE'] == 'tag'
                     else os.environ['REQUESTED_VERSION'])
          if not VERSION.fullmatch(version):
              raise SystemExit('expected a semantic preview version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
  native:
    needs: coordinate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UKAI_BUILD_DIRTY: 'false'
      PREVIEW_VERSION: ${{ needs.coordinate.outputs.version }}
      PREVIEW_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The tested freeze verifies ancestry and unchanged frozen inputs.
          fetch-depth: 0
          persist-credentials: false
      - name: Bind provenance to the checked-out commit
        run: printf 'UKAI_BUILD_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install build and signature tools
        run: |
          rustup toolchain install && rustup show
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - name: Require a recorded tested freeze
        run: cargo run -q -p xtask -- freeze --check
      - name: Require the recorded release evidence (K11, K27)
        env:
          UKAI_RELEASE_EVIDENCE: '1'
        run: cargo test --locked -p ukai-jail --test portable_release_evidence
      - name: Build the native Jail executable
        run: cargo build --locked --release -p ukai-jail
      - name: Exercise native signed installation
        # Temporary test key; package checks do not prove live containment.
        run: python3 crates/ukai-jail/dist/test_install.py target/release/ukai-jail
      - name: Stage the native package and build record
        run: |
          inputs=$(target/release/ukai-jail version --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["build"]["inputs"])')
          python3 crates/ukai-jail/dist/prepare_release.py stage \
            --binary target/release/ukai-jail --target "$PREVIEW_TARGET" \
            --revision "$UKAI_BUILD_REVISION" --inputs "$inputs" \
            --version "$PREVIEW_VERSION" --out stage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: stage/
          if-no-files-found: error
          retention-days: 14
  assemble:
    needs: [coordinate, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PREVIEW_VERSION: ${{ needs.coordinate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: native-*
          path: stages/
      - name: Assemble the unsigned candidate
        run: |
          inputs=$(python3 -c 'import json; print(json.load(open("stages/native-x86_64-unknown-linux-gnu/artifact.json"))["version"]["build"]["inputs"])')
          python3 crates/ukai-jail/dist/prepare_release.py assemble \
            --stage stages/native-x86_64-unknown-linux-gnu \
            --stage stages/native-aarch64-unknown-linux-gnu \
            --revision "$(git rev-parse HEAD)" --inputs "$inputs" \
            --version "$PREVIEW_VERSION" --out candidate
          echo 'Unsigned candidate; publication requires production signing and exact-commit CI/conformance.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ukai-jail-${{ needs.coordinate.outputs.version }}-candidate
          path: candidate/
          if-no-files-found: error
          retention-days: 14
