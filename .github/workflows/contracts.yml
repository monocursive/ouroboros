# Document contracts (jail-v1 §13, managed-teams §5): schemas, examples, golden
# fixtures and the link/anchor check. Proves nothing about a runtime.
name: contracts
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      # Third-party toolchain installer, so pinned to a commit like the rest.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - run: uv run docs/specs/jail-v1/validate_contract.py
      - run: uv run docs/specs/ledger-v1/validate_contract.py
      - run: python3 -m unittest discover -s docs/specs/ledger-v1 -p test_freeze.py
      - run: uv run docs/specs/managed-teams-v1/validate_policy.py
      - run: uv run docs/specs/validate_links.py
      - run: python3 -m unittest discover -s docs/benchmarks/jail -p test_performance.py
      - run: python3 -m unittest discover -s docs/benchmarks/jail -p test_agent_matrix.py
      - run: python3 -m unittest discover -s docs/benchmarks/jail -p test_observer_pair.py
      - run: python3 -m unittest discover -s docs/benchmarks/jail -p test_preview_evidence.py
      - run: python3 -m unittest discover -s docs/benchmarks -p test_retired_archives.py
      - name: Evidence store size and bundle guard
        run: |
          python3 docs/benchmarks/check_evidence_store.py
          python3 -m unittest discover -s docs/benchmarks -p test_check_evidence_store.py
      - name: VM transport boundary regressions (no live VM)
        run: python3 -m unittest discover -s crates/ouro-jail/vm -p 'test_*.py'
      - name: macOS mechanism evidence regressions (no live workloads)
        run: |
          python3 -m unittest discover -s docs/benchmarks/jail -p test_macos_es_pair_summary.py
          python3 -m unittest discover -s docs/benchmarks/jail -p test_macos_ptrace_lifetime_summary.py
          python3 -m unittest discover -s docs/benchmarks/jail -p test_macos_mach_lifetime_summary.py
          python3 -m unittest discover -s docs/benchmarks/jail -p test_macos_native_service_summary.py
      - name: Signed distribution regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign shellcheck
          shellcheck install.sh crates/ouro-jail/dist/install.sh
          python3 -m unittest discover -s crates/ouro-jail/dist -p test_release.py
          python3 -m unittest discover -s crates/ouro-jail/dist -p test_versions.py
          python3 -m unittest discover -s crates/ouro-jail/dist -p test_bootstrap.py
          python3 -m unittest discover -s crates/ouro-jail/dist -p test_publish.py
  website:
    # Builds the site the way it is deployed (deployment stays a manual step)
    # and checks that it serves the reviewed installer and key byte for byte.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22.22.3'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: The site serves the repository's installer and release key
        run: |
          cmp dist/install.sh ../install.sh
          cmp dist/release.pub ../crates/ouro-jail/dist/release.pub
