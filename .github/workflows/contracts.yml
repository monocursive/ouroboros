# Document contracts (jail-v1 §13, managed-teams §5): schemas, examples, golden
# fixtures and the link/anchor check. Proves nothing about a runtime.
name: contracts
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4, pinned by SHA
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6, pinned by SHA (third-party toolchain installer: highest-risk unpinned action)
      - run: uv run docs/specs/jail-v1/validate_contract.py
      - run: uv run docs/specs/ledger-v1/validate_contract.py
      - run: python3 -m unittest discover -s docs/specs/ledger-v1 -p test_freeze.py
      - run: uv run docs/specs/managed-teams-v1/validate_policy.py
      - run: uv run docs/specs/validate_links.py
      - run: python3 -m unittest discover -s docs/benchmarks/jail -p test_performance.py
      - run: python3 -m unittest discover -s docs/benchmarks/jail -p test_agent_matrix.py
      - run: python3 -m unittest discover -s docs/benchmarks/jail -p test_observer_pair.py
      - name: Signed distribution regressions
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign shellcheck
          shellcheck install.sh crates/ouro-jail/dist/install.sh
          python3 -m unittest discover -s crates/ouro-jail/dist -p test_release.py
          python3 -m unittest discover -s crates/ouro-jail/dist -p test_versions.py
          python3 -m unittest discover -s crates/ouro-jail/dist -p test_bootstrap.py
          python3 -m unittest discover -s crates/ouro-jail/dist -p test_publish.py
